project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "*.md"
    - "about/*.qmd"
    - "blog/**/*.qmd"
    - "community/*.qmd"
    - "cv/**/*.qmd"
    - "independent-projects/*.qmd"
    - "journey/*.qmd"
    - "projects/**/*.qmd"
    - "publications/*.qmd"
    - "tech-zone/**/*.qmd"
    - "nice/try/index.qmd"
    - "!Agents.md"
    - "!plan.md"
  post-render: bash fix-listing-urls.sh
  resources:
    - .nojekyll
    - CNAME
    - overleaf_presentations
    - files/site_icon/apple-touch-icon.png
    - files/site_icon/home-share-preview.png
    - files/about/PR_flag_island.png
    - files/journey/js/d3.min.js
    - files/journey/js/topojson-client.min.js
    - files/journey/data/countries-110m.json
    - files/journey/data/us-states.json
    - files/journey/stops
    - files/thesis_proposal/figures
    - files/thesis_proposal/proposal_slides_files
    - files/thesis_proposal/_extensions
    # Quarto auto-copies files referenced by <img src>, which is how the
    # rtd-rax gifs reach docs/. It does NOT do the same for <video src>
    # inside a raw ```{=html} block, so the looping card previews on the
    # projects page have to be declared explicitly or they 404 in the
    # built site while rendering perfectly in preview.
    - projects/**/*.mp4
    - googleffaf8e4b1a20676c.html

# Posts with `draft: true` in frontmatter should NOT render to docs/ at all
# (they leaked into the public listing once before — guard against that
# regression at the project level).
draft-mode: gone

website:
  title: "evannsmc"
  favicon: files/site_icon/favicon.png
  site-url: https://evannsmc.com
  description: "evannsmc is the personal research website of Evanns Morales, a Robotics Ph.D student at Georgia Tech."
  open-graph: true
  twitter-card: true

  page-footer:
    center: |
      [GitHub](https://github.com/evannsmc){target="_blank" rel="noopener"} · [LinkedIn](https://www.linkedin.com/in/evanns-morales/){target="_blank" rel="noopener"} · [Scholar](https://scholar.google.com/citations?user=kuWXwJsAAAAJ&hl=en&oi=ao){target="_blank" rel="noopener"} · [ORCID](https://orcid.org/0009-0000-3928-6243){target="_blank" rel="noopener"}
      <br>© 2026 evannsmc · Evanns Morales-Cuadrado · All rights reserved

  navbar:
    logo: files/site_icon/favicon.png
    left:
      - href: index.qmd
        text: Home
      - href: cv
        text: CV & Résumé
      - href: publications
        text: Publications
      - href: projects
        text: Projects
      - href: blog
        text: Research Blog
      - href: tech-zone
        text: The Tech Zone
      - href: about
        text: About Me
      - href: journey
        text: Journey



format:
  html:
    theme:
      light: lux
      dark: darkly
    css: styles.css
    # toc: true
    html-math-method: mathjax
    include-before-body:
      text: |
        <a class="skip-to-content" href="#quarto-content">Skip to main content</a>
    include-in-header:
      text: |
        <link rel="apple-touch-icon" sizes="180x180" href="files/site_icon/apple-touch-icon.png">
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@graph": [
            {
              "@type": "Person",
              "@id": "https://evannsmc.com/#person",
              "name": "Evanns Morales-Cuadrado",
              "alternateName": "evannsmc",
              "url": "https://evannsmc.com",
              "jobTitle": "Ph.D Student in Robotics and ECE",
              "affiliation": {
                "@type": "CollegeOrUniversity",
                "name": "Georgia Institute of Technology",
                "url": "https://www.gatech.edu"
              },
              "description": "Robotics and ECE Ph.D student at Georgia Tech researching safe autonomy, nonlinear control, and quadrotor UAVs.",
              "sameAs": [
                "https://github.com/evannsmc",
                "https://www.linkedin.com/in/evanns-morales/",
                "https://scholar.google.com/citations?user=FY9tS9oAAAAJ",
                "https://orcid.org/0009-0000-3928-6243"
              ]
            },
            {
              "@type": "WebSite",
              "@id": "https://evannsmc.com/#website",
              "name": "evannsmc",
              "url": "https://evannsmc.com",
              "description": "The personal research website of Evanns Morales-Cuadrado",
              "author": {
                "@id": "https://evannsmc.com/#person"
              }
            }
          ]
        }
        </script>
        <script>
        document.addEventListener('DOMContentLoaded', function () {
          var path = window.location.pathname.replace(/\/index\.html$/, '/');
          document.querySelectorAll('.navbar .nav-link').forEach(function (link) {
            var href = link.getAttribute('href');
            if (!href) return;
            var linkPath = new URL(href, window.location.origin).pathname.replace(/\/index\.html$/, '/');
            if (path === linkPath || (linkPath !== '/' && path.startsWith(linkPath))) {
              link.classList.add('active');
              link.setAttribute('aria-current', 'page');
            }
          });
        });
        </script>
        <script data-goatcounter="https://evannsmc.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
